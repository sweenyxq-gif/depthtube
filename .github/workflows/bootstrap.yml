name: Bootstrap site import
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch staged source
        run: |
          curl -L -o /tmp/src.zip "https://muse.ai/files/1301887619682058/1089820950344083/27lho43r6ff2kdarfyepos1q/depthtube-repo-src.zip"
          mkdir -p /tmp/src && cd /tmp/src && unzip -q /tmp/src.zip
      - name: Sync into repo
        run: |
          rsync -a --exclude='.git' /tmp/src/repo-src/ ./
          rm -f .github/workflows/bootstrap.yml
          git config user.name "depthtube-bootstrap"
          git config user.email "bootstrap@depthtube.local"
          git add -A
          git commit -m "DepthTube website source import" || echo "nothing to commit"
          git push
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main || echo "dispatch failed"
